name: Nightly rebuild

# The site is static: which gigs count as upcoming is decided while Netlify
# builds, not while someone views the page. Without a rebuild, a show stays
# listed as upcoming long after it happened. This nudges Netlify once a day
# so the lists, the "next show" line in the hero and the event data for
# search engines all move on by themselves.

on:
  schedule:
    # 04:20 UTC — early morning in Switzerland, so a show is filed away the
    # morning after it happened.
    - cron: '20 4 * * *'
  # Lets you trigger it by hand from the Actions tab.
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Netlify to rebuild
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::The NETLIFY_BUILD_HOOK secret is not set. Create a build hook in Netlify (Site configuration -> Build & deploy -> Build hooks) and add its URL under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          curl -fsS -X POST -d '{}' "$HOOK" > /dev/null
          echo "Netlify build triggered."
